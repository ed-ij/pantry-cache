<!--
  The dialog shown from the spreadsheet's Pantry Cache menu.

  Its job is the one step a non-technical person cannot do alone: turning a
  copied spreadsheet into a working web app. The server substitutes the
  placeholder in the script below for the deployment URL if there is one, so the
  dialog knows whether it is giving instructions or handing over a finished link.
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: #16222e;
    background: #fff;
  }
  h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: -0.01em; }
  p { margin: 0 0 12px; }
  .muted { color: #5a6b7d; }
  ol { margin: 0 0 14px; padding-left: 20px; }
  li { margin-bottom: 10px; }
  code, .path {
    background: #eef3f8;
    border-radius: 5px;
    padding: 1px 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    white-space: nowrap;
  }
  .url {
    display: block;
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border: 2px solid #0d6ec9;
    border-radius: 10px;
    background: #f5f9ff;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    word-break: break-all;
    color: #16222e;
  }
  .btn {
    appearance: none;
    border: 1px solid #cfdae6;
    background: #fff;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #16222e;
  }
  .btn-primary { background: #0d6ec9; border-color: #0d6ec9; color: #fff; }
  .note {
    border-left: 3px solid #c0541c;
    background: #fdf3ec;
    padding: 10px 12px;
    border-radius: 0 8px 8px 0;
    margin: 14px 0 0;
    color: #8a4416;
  }
  .ok { border-left-color: #197a52; background: #e9f5ef; color: #146141; }
  .row { display: flex; gap: 8px; align-items: center; }
</style>

<div id="root"></div>

<script>
  var APP_URL = '__APP_URL__';
  var BUILD = '__BUILD__';

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function deployed() {
    return '' +
      '<h1>Your Pantry Cache is live</h1>' +
      '<p class="muted">This is the address of <em>your</em> copy. It reads and writes only ' +
      'your own spreadsheet.</p>' +
      '<div class="url" id="url">' + esc(APP_URL) + '</div>' +
      '<div class="row">' +
        '<button class="btn btn-primary" id="copy">Copy the link</button>' +
        '<span class="muted" id="copied"></span>' +
      '</div>' +
      '<p style="margin-top:16px"><strong>To put it on a tablet or phone</strong><br>' +
      'Email the link to yourself, open it on the device, then use the browser\'s ' +
      '<em>Add to Home screen</em>. It then opens like an app, full screen.</p>' +
      '<div class="note">Treat this link like a key. Anyone who has it can see and ' +
      'change your store list without signing in. Share it only with people you ' +
      'would let edit the spreadsheet itself.</div>';
  }

  function notDeployed() {
    return '' +
      '<h1>One step left</h1>' +
      '<p class="muted">The tabs are ready. Now publish the app so you can open it on ' +
      'a tablet or phone. You only ever do this once.</p>' +
      '<ol>' +
        '<li>In the menu bar above, choose <span class="path">Extensions</span> &rarr; ' +
          '<span class="path">Apps&nbsp;Script</span>. A code window opens in a new tab.</li>' +
        '<li>Top right of that window, click <span class="path">Deploy</span> &rarr; ' +
          '<span class="path">New deployment</span>.</li>' +
        '<li>Click the gear icon beside <em>Select type</em> and choose ' +
          '<span class="path">Web app</span>. Set <em>Execute as</em> to ' +
          '<span class="path">Me</span> and <em>Who has access</em> to ' +
          '<span class="path">Anyone</span>.</li>' +
        '<li>Click <span class="path">Deploy</span>. Google will ask you to allow the ' +
          'script to use your spreadsheet &mdash; it is your own script, so the warning ' +
          'about an unverified app is expected. Choose <span class="path">Advanced</span>, ' +
          'then the <em>Go to&hellip;</em> link, then <span class="path">Allow</span>.</li>' +
        '<li>Come back here and open this menu again to get your link.</li>' +
      '</ol>' +
      '<div class="note ok">Everything stays yours. The app runs from your own copy of ' +
      'this spreadsheet, in your own Google account. Nobody else can see it.</div>';
  }

  function stamp() {
    // So a bug report can name a version, and "Check for updates" has
    // something to compare against.
    if (!BUILD || BUILD.indexOf('__') === 0) return '';
    var d = new Date(BUILD);
    var when = isNaN(d.getTime())
      ? BUILD
      : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    return '<p class="muted" style="margin-top:18px;font-size:12.5px">' +
      'This copy was built ' + esc(when) + '. ' +
      'Use <em>Pantry Cache &rarr; Check for updates</em> to see if there is a newer one.</p>';
  }

  document.getElementById('root').innerHTML =
    (APP_URL && APP_URL.indexOf('http') === 0 ? deployed() : notDeployed()) + stamp();

  var copy = document.getElementById('copy');
  if (copy) {
    copy.addEventListener('click', function () {
      var said = document.getElementById('copied');
      var done = function () { said.textContent = 'Copied'; };
      // The dialog runs in a sandboxed frame, where the clipboard API is often
      // unavailable; falling back to a selection keeps the button useful.
      try {
        navigator.clipboard.writeText(APP_URL).then(done, select);
      } catch (e) {
        select();
      }
      function select() {
        var r = document.createRange();
        r.selectNodeContents(document.getElementById('url'));
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
        said.textContent = 'Selected — press ⌘C or Ctrl+C';
      }
    });
  }
</script>
