<style>
/* ==========================================================================
   Freezer Log — tablet-first, large-type interface.
   Everything is sized for a finger on a tablet propped next to a freezer.
   ========================================================================== */

:root {
  --bg: #eef3f8;
  --surface: #ffffff;
  --surface-2: #f5f8fb;
  --surface-3: #e6edf5;
  --ink: #14202b;
  --ink-2: #56687a;
  --ink-3: #5a6c7d;
  --line: #d9e2ec;
  --accent: #0d6ec9;
  --accent-ink: #ffffff;
  --accent-soft: #e2eefb;
  --warm: #9c410f;
  --warm-ink: #ffffff;
  --warm-soft: #fbeade;
  --good: #197a52;
  --good-soft: #e0f2e9;
  --danger: #b02f39;
  --shadow: 0 1px 2px rgba(20, 40, 60, .06), 0 6px 20px rgba(20, 40, 60, .07);
  --shadow-lift: 0 2px 6px rgba(20, 40, 60, .10), 0 18px 44px rgba(20, 40, 60, .16);

  --tap: 3.4rem;
  --radius: 16px;
  --radius-sm: 11px;
  --gap: 14px;
  --page: 940px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d151e;
    --surface: #17222e;
    --surface-2: #1c2837;
    --surface-3: #243546;
    --ink: #e9f0f7;
    --ink-2: #a2b4c6;
    --ink-3: #7b8ea2;
    --line: #2a3b4d;
    --accent: #4f9df2;
    --accent-ink: #07121d;
    --accent-soft: #172f49;
    --warm: #f08b4d;
    --warm-ink: #1d1005;
    --warm-soft: #3a2517;
    --good: #4cbc8a;
    --good-soft: #122e24;
    --danger: #f0707a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .35);
    --shadow-lift: 0 2px 6px rgba(0, 0, 0, .4), 0 18px 44px rgba(0, 0, 0, .5);
  }
}

* { box-sizing: border-box; }

html {
  font-size: 19px;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

/* ------------------------------------------------------------------ shell */

.app {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gap);
  padding: 12px max(16px, env(safe-area-inset-left)) 12px max(16px, env(safe-area-inset-right));
  /* Plain colour first: without color-mix (pre-Safari 16.2) the second
     declaration is dropped, and with no fallback the bar would be transparent
     and the list would scroll through it. */
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 1.15rem;
  letter-spacing: -0.01em;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 2rem;
  height: 2rem;
  border-radius: 10px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 1.15rem;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink-2);
  font-size: .85rem;
}

.panel {
  flex: 1;
  width: 100%;
  max-width: var(--page);
  margin: 0 auto;
  padding: 18px max(16px, env(safe-area-inset-left)) 140px max(16px, env(safe-area-inset-right));
  outline: none;
}

/* ---------------------------------------------------------------- tab bar */

.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  display: flex;
  gap: 6px;
  padding: 8px max(10px, env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-right));
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  backdrop-filter: saturate(1.4) blur(14px);
  border-top: 1px solid var(--line);
}

.tab {
  flex: 1;
  min-height: 4rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink-2);
  font-weight: 600;
  font-size: .82rem;
  cursor: pointer;
  transition: background .15s, color .15s;
  max-width: 300px;
  margin: 0 auto;
}

.tab-icon { font-size: 1.35rem; line-height: 1; }

.tab.is-active { background: var(--accent-soft); color: var(--accent); }
.tab.is-active.is-warm { background: var(--warm-soft); color: var(--warm); }

/* ----------------------------------------------------------------- pieces */

.stack { display: flex; flex-direction: column; gap: var(--gap); }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
}

.card-flush { padding: 0; overflow: hidden; }

.card-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}

.card-title { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
.card-sub { color: var(--ink-2); font-size: .85rem; }

.section-title {
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 4px 0 0;
}

.label {
  display: block;
  font-size: .85rem;
  font-weight: 700;
  color: var(--ink-2);
  margin-bottom: 8px;
}

.muted { color: var(--ink-2); }
.small { font-size: .82rem; }

/* ----------------------------------------------------------------- inputs */

.input {
  width: 100%;
  min-height: var(--tap);
  padding: 0 16px;
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font-size: 1.05rem;
}

.input:focus-visible,
.btn:focus-visible,
.chip:focus-visible,
.tab:focus-visible,
.row-btn:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

.input-hero {
  min-height: 4.2rem;
  font-size: 1.25rem;
  font-weight: 600;
  border-color: var(--accent);
  background: var(--surface);
}

.input::placeholder { color: var(--ink-3); font-weight: 400; }

/* ---------------------------------------------------------------- buttons */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: var(--tap);
  padding: 0 20px;
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink);
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  text-decoration: none;
  transition: transform .08s, background .15s, border-color .15s;
}

.btn:active { transform: scale(.985); }
.btn[disabled] { opacity: .45; cursor: default; }

.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-warm { background: var(--warm); border-color: var(--warm); color: var(--warm-ink); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn-block { width: 100%; }

.btn-hero {
  min-height: 4.4rem;
  font-size: 1.15rem;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.btn-sub {
  display: block;
  font-weight: 500;
  font-size: .82rem;
  opacity: .85;
}

/* ------------------------------------------------------------------ chips */

.chips { display: flex; flex-wrap: wrap; gap: 9px; }

.chip {
  min-height: 3rem;
  padding: 0 18px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  font-size: .95rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: background .15s, border-color .15s, color .15s;
}

.chip.is-on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.is-on-warm { background: var(--warm); border-color: var(--warm); color: var(--warm-ink); }

.dot {
  width: .7rem;
  height: .7rem;
  border-radius: 999px;
  flex: none;
  background: var(--fz, var(--ink-3));
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12);
}

/*
 * The spreadsheet holds one colour per freezer, chosen to look right on the
 * light theme. On the dark theme it is lightened here, the same way the built-in
 * palette shifts (accent #0d6ec9 -> #4f9df2) — so a colour only has to be picked
 * once, and cannot end up illegible on one theme or the other.
 *
 * This has to sit after the rules above rather than in the dark block at the
 * top of the file: same specificity, so the later one wins.
 */
@media (prefers-color-scheme: dark) {
  .dot,
  .freezer-bar {
    background: color-mix(in oklab, var(--fz, var(--ink-3)) 66%, #ffffff);
  }

  .dot { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18); }
}

/* --------------------------------------------------------------- stepper */

.stepper {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  padding: 6px;
}

.stepper-btn {
  width: 3.2rem;
  height: 3.2rem;
  flex: none;
  border: 0;
  border-radius: 10px;
  background: var(--surface-3);
  color: var(--ink);
  font-size: 1.5rem;
  font-weight: 700;
  cursor: pointer;
  display: grid;
  place-items: center;
}

.stepper-btn:active { background: var(--accent-soft); }
.stepper-btn[disabled] { opacity: .35; }

.stepper-value {
  flex: 1;
  text-align: center;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.stepper-value small,
.weigher-value small {
  display: block;
  font-size: .68rem;
  font-weight: 600;
  color: var(--ink-3);
  letter-spacing: .06em;
  text-transform: uppercase;
}

/* --------------------------------------------------------------- weigher */
/* Coarse (50 g) outside, fine (10 g) inside, the number in the middle.
   Every button states its own size so nothing is a guess. */

.weigher {
  display: flex;
  align-items: stretch;
  gap: 6px;
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  padding: 6px;
}

.step-btn {
  flex: none;
  min-height: 3.4rem;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  display: grid;
  place-items: center;
  transition: background .12s;
}

.step-coarse {
  width: 3.5rem;
  background: var(--surface-3);
  color: var(--ink-2);
  font-size: .92rem;
}

.step-fine {
  width: 3.5rem;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: .92rem;
}

.step-btn:active { filter: brightness(.93); }
.step-btn[disabled] { opacity: .3; cursor: default; }

.weigher-value {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
  text-align: center;
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.weigher-value:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

@media (max-width: 420px) {
  .step-coarse, .step-fine { width: 2.9rem; font-size: .82rem; }
  .weigher-value { font-size: 1.25rem; }
}

/* ---------------------------------------------------------------- keypad */

.keypad-display {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 6px;
  margin: 16px 0 2px;
  padding: 14px;
  border-radius: var(--radius);
  background: var(--surface-2);
  border: 1px solid var(--line);
}

.keypad-number {
  font-size: 2.6rem;
  font-weight: 800;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.keypad-unit { font-size: 1.1rem; font-weight: 700; color: var(--ink-2); }

.keypad-note {
  min-height: 1.4rem;
  text-align: center;
  font-size: .82rem;
  color: var(--ink-2);
  margin-bottom: 12px;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.key {
  min-height: 3.9rem;
  border: 0;
  border-radius: 12px;
  background: var(--surface-3);
  color: var(--ink);
  font-size: 1.5rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}

.key:active { background: var(--accent-soft); }
.key-alt { background: var(--surface-2); color: var(--ink-2); font-size: 1.3rem; }

/* ------------------------------------------------------------ card hint */

.card-hint {
  padding: 9px 18px;
  text-align: right;
  font-size: .8rem;
  color: var(--ink-3);
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
}

/* ------------------------------------------------------------ item tiles */
/* A grid packs three or four times as many items onto the screen as a list,
   which is the difference between scrolling to find something and just
   seeing it. */

.tile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr));
  gap: 9px;
  align-items: stretch;
}

.tile {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
  min-height: 4.5rem;
  padding: 12px 14px;
  border: 2px solid var(--line);
  border-radius: 13px;
  background: var(--surface);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: border-color .12s, background .12s, transform .08s;
}

.tile:active { transform: scale(.98); }
.tile:hover { border-color: var(--accent); }
.tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.tile-name {
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}

.tile-meta {
  font-size: .74rem;
  font-weight: 600;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.tile.is-empty { border-style: dashed; }
.tile.is-empty .tile-name { color: var(--ink-2); }
.tile.is-empty .tile-meta { color: var(--ink-3); font-weight: 500; }

.tile-more {
  align-items: center;
  justify-content: center;
  border-style: dashed;
  color: var(--accent);
  font-weight: 700;
  font-size: .9rem;
}

.tile-new {
  border-color: var(--good);
  background: var(--good-soft);
}

.tile-new .tile-name { color: var(--good); }
.tile-new .tile-meta { color: var(--good); opacity: .8; }

.cat-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 6px 0 -4px;
}

.cat-name {
  font-size: .8rem;
  font-weight: 800;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.cat-count { font-size: .76rem; color: var(--ink-3); opacity: .8; }

/* --------------------------------------------------------- chip totals */

.row-sub {
  font-size: .78rem;
  font-weight: 600;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  margin-top: 1px;
}

.not-set {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 3.4rem;
  padding: 6px 6px 6px 18px;
  border: 2px dashed var(--line);
  border-radius: var(--radius-sm);
  color: var(--ink-2);
  font-weight: 600;
}

.chip-num {
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  opacity: .72;
}

.icon-btn {
  flex: none;
  width: 2.2rem;
  height: 2.2rem;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-3);
  font-size: .95rem;
  cursor: pointer;
}

.icon-btn:hover, .icon-btn:focus-visible { background: var(--surface-3); color: var(--accent); }

.lots-foot {
  padding-top: 4px;
  border-top: 1px dashed var(--line);
  margin-top: 4px;
}

.group-meta { font-weight: 600; letter-spacing: 0; text-transform: none; opacity: .8; }

/* ------------------------------------------------------------ suggestions */

.suggest {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
}

.row-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  min-height: var(--tap);
  padding: 12px 16px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  cursor: pointer;
}

.row-btn:last-child { border-bottom: 0; }
.row-btn:active { background: var(--surface-2); }

.row-main { flex: 1; min-width: 0; }
.row-name { font-size: 1.08rem; font-weight: 700; letter-spacing: -0.01em; }
.row-meta { font-size: .82rem; color: var(--ink-2); margin-top: 2px; }
.row-right { text-align: right; flex: none; }
.row-strong { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.row-chevron { color: var(--ink-3); font-size: 1.1rem; flex: none; }

.row-btn.is-new { background: var(--good-soft); }
.row-btn.is-new .row-name { color: var(--good); }

/* ----------------------------------------------------------------- badges */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--surface-3);
  color: var(--ink-2);
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .02em;
  white-space: nowrap;
}

.badge-warm { background: var(--warm-soft); color: var(--warm); }
.badge-good { background: var(--good-soft); color: var(--good); }
.badge-freezer { background: var(--surface-3); color: var(--ink-2); }

/* ------------------------------------------------------------- summary bar */

.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.stat {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}

.stat-num { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.stat-sub {
  font-size: .8rem;
  font-weight: 700;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  margin-top: 1px;
}

.stat-label { font-size: .76rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-top: 2px; }

/* ------------------------------------------------------------ segmented */

.seg {
  display: flex;
  gap: 4px;
  padding: 5px;
  background: var(--surface-3);
  border-radius: 999px;
}

.seg-btn {
  flex: 1;
  min-height: 3rem;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink-2);
  font-weight: 700;
  font-size: .95rem;
  cursor: pointer;
}

.seg-btn.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* --------------------------------------------------------- freezer cards */

.freezer-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
}

.freezer-bar {
  width: 6px;
  align-self: stretch;
  border-radius: 999px;
  flex: none;
  background: var(--fz, var(--ink-3));
}
.freezer-name { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }

.group-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  font-size: .76rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--ink-3);
}

.lots {
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  padding: 4px 18px 12px;
}

.lot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px dashed var(--line);
  font-size: .92rem;
}

.lot:last-child { border-bottom: 0; }
.lot-weight { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 4.6rem; }
.lot-date { color: var(--ink-2); }

/* ----------------------------------------------------------------- toast */

.toast-host {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(5.4rem + env(safe-area-inset-bottom));
  z-index: 60;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  pointer-events: none;
}

.toast {
